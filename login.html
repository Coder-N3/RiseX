
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | RiseX</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<main class="login-page">

    <section class="login-card">


        <!-- =========================
             BRAND
        ========================== -->

        <div class="login-brand">

            <div class="login-logo">
                <img src="risex-logo.png" alt="RiseX Logo">
            </div>

            <div class="login-brand-text">

                <span class="login-brand-name">
                    RiseX
                </span>

                <span class="login-brand-tag">
                    DISCOVER • COMPETE • RISE
                </span>

            </div>

        </div>


        <!-- =========================
             WELCOME
        ========================== -->

        <div class="login-content">

            <span class="login-badge">
                ✨ Welcome back
            </span>


            <h1>
                Find what's<br>
                <span>next for you.</span>
            </h1>


            <p class="login-subtitle">
                Discover hackathons, competitions, olympiads
                and more — matched to your interests.
            </p>


            <!-- =========================
                 GOOGLE LOGIN
            ========================== -->

            <button
                id="googleLoginBtn"
                class="google-login-btn"
                type="button"
            >

                <span class="google-icon">
                    G
                </span>

                <span>
                    Continue with Googli
                </span>
                        <!--  it is fake for now-->
            </button>


            <!-- =========================
                 DIVIDER
            ========================== -->

            <div class="login-divider">

                <span>
                    or
                </span>

            </div>


            <!-- =========================
                 GUEST LOGIN
            ========================== -->

            <button
                id="guestBtn"
                class="guest-btn"
                type="button"
            >

                <span>
                    Continue as Guest
                </span>

            </button>


            <!-- =========================
                 NOTE
            ========================== -->

            <p class="login-note">
                Your profile, saved opportunities and activity
                can be remembered on this device.
            </p>

        </div>


        <!-- =========================
             FOOTER
        ========================== -->

        <div class="login-footer">

            <span>RISEX</span>

            <span>•</span>

            <span>
                DISCOVER YOUR NEXT CHALLENGE
            </span>

        </div>


    </section>

</main>


<script src="login.js"></script>

</body>

</html>
